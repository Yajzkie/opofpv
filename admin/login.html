<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OSOFPV Admin Login</title>

    <link rel="stylesheet" href="admin.css">

</head>


<body>

    <div class="login-container">

        <div class="login-box">

            <img
                src="../images/logo.png"
                alt="OSOFPV"
                class="login-logo"
            >

            <h1>Admin Login</h1>

            <p>OSOFPV Management</p>


            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

                <p id="loginMessage"></p>

            </form>

        </div>

    </div>


    <script type="module" src="admin.js"></script>

</body>

</html>
