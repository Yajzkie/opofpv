<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OPOfpv — All Videos</title>

    <meta
        name="description"
        content="Browse all cinematic FPV drone videos by OPOfpv."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Saira:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="videos.css">

</head>


<body class="videos-page">

    <!-- HEADER -->

    <header class="videos-header">

        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="OPOfpv">
        </a>

        <nav>
            <ul>
                <li><a href="index.html#work">← Back to site</a></li>
            </ul>
        </nav>

    </header>


    <!-- ALL VIDEOS -->

    <main class="videos-main">

        <div class="section-head">

            <p class="eyebrow">// Our Work</p>
            <h2>All flights</h2>

        </div>

        <div id="allVideosGrid" class="work-cards">

            <p class="videos-loading">Loading videos...</p>

        </div>

    </main>


    <!-- VIDEO PLAYER -->

    <div class="work-video-player" id="workVideoPlayer">

        <button id="closeWorkVideo" aria-label="Close video">
            ✕
        </button>

        <video id="workVideo" controls>
            Your browser does not support the video tag.
        </video>

    </div>


    <footer>

        <div class="footer-bottom">
            <p>© 2026 OPOfpv. All rights reserved.</p>
        </div>

    </footer>


    <script type="module" src="videos.js"></script>

</body>

</html>
